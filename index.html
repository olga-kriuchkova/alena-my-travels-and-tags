
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Travels and Tags</title>

    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/qgis2web.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            overflow: hidden;
        }

        /* MAIN LAYOUT */

        #layout {
            display: grid;
            grid-template-columns: 70% 30%;
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }

        #map {
            width: 100%;
            height: 100%;
            min-width: 0;
            background: #ffffff;
        }

        /* RIGHT PANEL */

        #sidebar {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            min-width: 0;
            overflow-y: auto;
            padding: 28px;
            background: #ffffff;
            border-left: 1px solid #e5e5e5;
        }

        #sidebar-main {
            flex: 1 0 auto;
        }

        #sidebar h1 {
            margin: 0 0 28px;
            font-size: 23px;
            font-weight: 600;
            line-height: 1.2;
        }

        #place-title {
            margin: 0 0 8px;
            font-size: 20px;
            font-weight: 600;
        }

        #place-address {
            margin: 0 0 22px;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.6;
            color: #777777;
        }

        #place-description {
            margin: 0 0 20px;
            font-size: 13px;
            line-height: 1.6;
            color: #888888;
        }

        /* PHOTO GALLERY */

        #photo-gallery {
            display: grid;
            grid-template-columns: repeat(
                2,
                minmax(0, 1fr)
            );
            gap: 10px;
            align-content: start;
            padding-bottom: 28px;
        }

        .gallery-photo {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            cursor: zoom-in;
            transition: opacity 0.2s ease;
        }

        .gallery-photo:hover {
            opacity: 0.85;
        }

        /* PHOTO VIEWER */

        #photo-viewer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 48px;
            background: rgba(0, 0, 0, 0.88);
            cursor: zoom-out;
        }

        #photo-viewer.open {
            display: flex;
        }

        #photo-viewer img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            cursor: default;
        }

        #close-photo-viewer {
            position: absolute;
            top: 14px;
            right: 24px;
            border: 0;
            background: transparent;
            color: white;
            font-size: 34px;
            cursor: pointer;
        }

        /* LOWER RIGHT PANEL */

        #sidebar-bottom {
            margin-top: auto;
            flex-shrink: 0;
        }

        /* LEGEND */

        #legend {
            padding-top: 22px;
            border-top: 1px solid #eeeeee;
        }

        #legend h3 {
            margin: 0 0 16px;
            font-size: 15px;
            font-weight: 600;
        }

        #legend-items {
            display: grid;
            grid-template-rows: repeat(5, auto);
            grid-auto-flow: column;
            grid-auto-columns: minmax(0, 1fr);
            gap: 10px 14px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            font-size: 13px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .legend-name {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .legend-message {
            grid-column: 1 / -1;
            color: #888888;
            font-size: 13px;
            line-height: 1.5;
        }

        /* MAP SOURCES AT BOTTOM RIGHT */

        #map-credits {
            margin-top: 28px;
            padding-top: 14px;
            border-top: 1px solid #eeeeee;
            color: #444444;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.5;
            text-align: right;
        }

        #map-credits a {
            color: #185d91;
            font-weight: 600;
            text-decoration: none;
        }

        #map-credits a:hover {
            text-decoration: underline;
        }

        /* MOBILE LAYOUT */

        @media (max-width: 750px) {

            body {
                overflow: auto;
            }

            #layout {
                display: flex;
                flex-direction: column;
                height: auto;
                min-height: 100dvh;
            }

            #map {
                height: 60dvh;
                min-height: 350px;
                flex-shrink: 0;
            }

            #sidebar {
                height: auto;
                min-height: 40dvh;
                padding: 22px;
                overflow: visible;
            }

            #sidebar-main {
                flex: 0 0 auto;
            }

            #sidebar-bottom {
                margin-top: 40px;
            }

            #photo-viewer {
                padding: 16px;
            }

        }

    </style>
</head>

<body>

    <div id="layout">

        <div id="map"></div>

        <aside id="sidebar">

            <div id="sidebar-main">

                <h1>My Travels and Tags</h1>

                <section id="place-info">

                    <h2 id="place-title">
                        Select a location
                    </h2>

                    <p id="place-address"></p>

                    <p id="place-description">
                        Click a cat on the map to explore a place.
                    </p>

                    <div id="photo-gallery"></div>

                </section>

            </div>

            <div id="sidebar-bottom">

                <section id="legend">

                    <h3>Legend</h3>

                    <div id="legend-items">
                        <span class="legend-message">
                            Loading countries...
                        </span>
                    </div>

                </section>

                <footer id="map-credits">

                    <a
                        href="https://leafletjs.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >Leaflet</a>

                    |

                    &copy;

                    <a
                        href="https://www.openstreetmap.org/copyright"
                        target="_blank"
                        rel="noopener noreferrer"
                    >OpenStreetMap contributors</a>

                </footer>

            </div>

        </aside>

    </div>

    <!-- FULL-SIZE PHOTO VIEWER -->

    <div
        id="photo-viewer"
        role="dialog"
        aria-label="Photo viewer"
        aria-modal="true"
    >

        <button
            id="close-photo-viewer"
            aria-label="Close photo"
        >×</button>

        <img
            id="viewer-image"
            alt="Travel photo"
        >

    </div>

    <!-- LEAFLET LIBRARIES -->

    <script src="js/leaflet.js"></script>
    <script src="js/leaflet-hash.js"></script>

    <!-- QGIS EXPORTED PINS -->

    <script src="data/Pins_4.js"></script>

    <script>

        // ============================================
        // PROJECT DATA FILES
        // ============================================

        const DATA_FILES = {
            countries: 'data/countries.geojson',
            styles: 'data/country_styles.json',
            photos: 'data/photos.json'
        };

        // ============================================
        // MAP BOUNDS
        // ============================================

        const worldBounds = L.latLngBounds(
            [-85, -180],
            [85, 180]
        );

        // ============================================
        // MAP INITIALIZATION
        // ============================================

        const map = L.map('map', {

            zoomControl: true,
            minZoom: 2,
            maxZoom: 19,
            preferCanvas: false,

            maxBounds: worldBounds,
            maxBoundsViscosity: 1.0,

            worldCopyJump: false,
            attributionControl: false

        });

        map.fitBounds([
            [39.38045544558549, -6.926092115912226],
            [63.19503550981542, 61.0810361472603]
        ]);

        const hash = new L.Hash(map);

        // ============================================
        // OPENSTREETMAP BASE LAYER
        // ============================================

        const osmLayer = L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {

                attribution:
                    '&copy; OpenStreetMap contributors',

                minZoom: 2,
                maxZoom: 19,

                noWrap: true,
                bounds: worldBounds

            }
        );

        osmLayer.addTo(map);

        // ============================================
        // DYNAMIC COUNTRY DATA
        // ============================================

        const countryLayers = [];
        const countryStyles = new Map();

        const legendItems = document.getElementById(
            'legend-items'
        );

        // ============================================
        // DATA LOADING
        // ============================================

        async function loadJSON(url) {

            const response = await fetch(url, {
                cache: 'no-store'
            });

            if (!response.ok) {

                throw new Error(
                    'Could not load ' +
                    url +
                    ' (HTTP ' +
                    response.status +
                    ')'
                );

            }

            return await response.json();

        }

        // ============================================
        // SVG GRADIENT HELPERS
        // ============================================

        const svgNamespace =
            'http://www.w3.org/2000/svg';

        function createSvgElement(tagName) {

            return document.createElementNS(
                svgNamespace,
                tagName
            );

        }

        function safeOpacity(value, fallback = 1) {

            const number = Number(value);

            if (!Number.isFinite(number)) {
                return fallback;
            }

            return Math.max(
                0,
                Math.min(1, number)
            );

        }

        function safeColor(value, fallback) {

            if (
                typeof value === 'string' &&
                /^#[0-9a-fA-F]{6}$/.test(value)
            ) {
                return value;
            }

            return fallback;

        }

        function normalizeCountryStyle(raw) {

            if (
                !raw ||
                typeof raw !== 'object'
            ) {
                throw new Error(
                    'Invalid country style record.'
                );
            }

            const id = String(
                raw.id || ''
            ).trim();

            if (!id) {

                throw new Error(
                    'Country style has no ID.'
                );

            }

            const topColor = safeColor(
                raw.top_color,
                '#cccccc'
            );

            const bottomColor = safeColor(
                raw.bottom_color,
                '#ffffff'
            );

            const outlineColor = safeColor(
                raw.outline_color,
                topColor
            );

            const widthMM = Number(
                raw.outline_width_mm
            );

            // Convert QGIS millimeters to CSS pixels.
            // 1 CSS inch = 96 pixels.
            // 1 inch = 25.4 millimeters.

            const strokeWidth = (
                Number.isFinite(widthMM)
                && widthMM >= 0
            )
                ? widthMM * 96 / 25.4
                : 1;

            return {

                id: id,

                name: String(
                    raw.name || id
                ),

                start: topColor,
                end: bottomColor,
                border: outlineColor,

                topOpacity: safeOpacity(
                    raw.top_opacity,
                    0.5
                ),

                bottomOpacity: safeOpacity(
                    raw.bottom_opacity,
                    0.5
                ),

                borderOpacity: safeOpacity(
                    raw.outline_opacity,
                    1
                ),

                borderWidth: strokeWidth,

                x1: '50%',
                y1: '0%',
                x2: '50%',
                y2: '100%'

            };

        }

        function ensureGradient(
            svg,
            gradientId,
            settings
        ) {

            if (!svg) {
                return;
            }

            let defs = svg.querySelector('defs');

            if (!defs) {

                defs = createSvgElement('defs');

                svg.insertBefore(
                    defs,
                    svg.firstChild
                );

            }

            let gradient = Array.from(
                defs.querySelectorAll('linearGradient')
            ).find(function(element) {

                return (
                    element.getAttribute('id')
                    === gradientId
                );

            });

            if (!gradient) {

                gradient = createSvgElement(
                    'linearGradient'
                );

                gradient.setAttribute(
                    'id',
                    gradientId
                );

                defs.appendChild(gradient);

            }

            gradient.setAttribute(
                'gradientUnits',
                'objectBoundingBox'
            );

            gradient.setAttribute(
                'x1',
                settings.x1
            );

            gradient.setAttribute(
                'y1',
                settings.y1
            );

            gradient.setAttribute(
                'x2',
                settings.x2
            );

            gradient.setAttribute(
                'y2',
                settings.y2
            );

            gradient.replaceChildren();

            const firstStop = createSvgElement(
                'stop'
            );

            firstStop.setAttribute(
                'offset',
                '0%'
            );

            firstStop.setAttribute(
                'stop-color',
                settings.start
            );

            firstStop.setAttribute(
                'stop-opacity',
                String(settings.topOpacity)
            );

            const secondStop = createSvgElement(
                'stop'
            );

            secondStop.setAttribute(
                'offset',
                '100%'
            );

            secondStop.setAttribute(
                'stop-color',
                settings.end
            );

            secondStop.setAttribute(
                'stop-opacity',
                String(settings.bottomOpacity)
            );

            gradient.appendChild(
                firstStop
            );

            gradient.appendChild(
                secondStop
            );

        }

        // ============================================
        // APPLY GRADIENT TO MAP POLYGON
        // ============================================

        function applyGradientToShape(
            shape,
            gradientId,
            settings
        ) {

            if (
                !shape._path ||
                !shape._renderer
            ) {
                return;
            }

            const svg =
                shape._renderer._container;

            ensureGradient(
                svg,
                gradientId,
                settings
            );

            shape._path.setAttribute(
                'fill',
                'url(#' + gradientId + ')'
            );

            shape._path.style.fill =
                'url(#' + gradientId + ')';

            // The transparency is stored in
            // individual SVG gradient stops.

            shape._path.setAttribute(
                'fill-opacity',
                '1'
            );

            shape._path.style.fillOpacity = '1';

            shape._path.setAttribute(
                'stroke',
                settings.border
            );

            shape._path.setAttribute(
                'stroke-opacity',
                String(settings.borderOpacity)
            );

            shape._path.setAttribute(
                'stroke-width',
                String(settings.borderWidth)
            );

        }

        // ============================================
        // CREATE COUNTRY LAYER
        // ============================================

        function addCountry(
            countryId,
            features,
            settings,
            index
        ) {

            const paneName =
                'pane_country_' + index;

            map.createPane(paneName);

            const pane = map.getPane(
                paneName
            );

            pane.style.zIndex = 401;
            pane.style.pointerEvents = 'none';

            // Each country has its own SVG renderer.
            // This avoids gradient ID collisions.

            const renderer = L.svg({
                pane: paneName,
                padding: 0.5
            });

            const gradientId =
                'country_gradient_' + index;

            const collection = {

                type: 'FeatureCollection',
                features: features

            };

            const layer = L.geoJSON(
                collection,
                {

                    pane: paneName,
                    renderer: renderer,
                    interactive: false,

                    style: function() {

                        return {

                            color: settings.border,

                            weight: settings.borderWidth,

                            opacity:
                                settings.borderOpacity,

                            fillColor:
                                settings.start,

                            fillOpacity: 1,

                            interactive: false

                        };

                    }

                }
            );

            layer.addTo(map);

            function updateGradient() {

                layer.eachLayer(function(shape) {

                    applyGradientToShape(
                        shape,
                        gradientId,
                        settings
                    );

                });

            }

            requestAnimationFrame(
                updateGradient
            );

            layer.on(
                'add',
                function() {

                    requestAnimationFrame(
                        updateGradient
                    );

                }
            );

            countryLayers.push({

                id: countryId,
                layer: layer,
                updateGradient: updateGradient

            });

            return layer;

        }

        // ============================================
        // DYNAMIC LEGEND
        // ============================================

        function showLegendMessage(message) {

            legendItems.replaceChildren();

            const item = document.createElement(
                'span'
            );

            item.className = 'legend-message';
            item.textContent = message;

            legendItems.appendChild(item);

        }

        function addLegendItem(settings) {

            const row = document.createElement(
                'div'
            );

            row.className = 'legend-row';

            const swatch = document.createElement(
                'span'
            );

            swatch.className = 'legend-color';

            // The legend uses the actual exported
            // gradient colors and their transparency.

            swatch.style.background =
                'linear-gradient(' +
                'to bottom, ' +
                hexToRgba(
                    settings.start,
                    settings.topOpacity
                ) +
                ', ' +
                hexToRgba(
                    settings.end,
                    settings.bottomOpacity
                ) +
                ')';

            swatch.style.border =
                '1px solid ' +
                hexToRgba(
                    settings.border,
                    settings.borderOpacity
                );

            const name = document.createElement(
                'span'
            );

            name.className = 'legend-name';
            name.textContent = settings.name;

            row.appendChild(swatch);
            row.appendChild(name);

            legendItems.appendChild(row);

        }

        function hexToRgba(hex, opacity) {

            const clean = hex.replace('#', '');

            const red = parseInt(
                clean.substring(0, 2),
                16
            );

            const green = parseInt(
                clean.substring(2, 4),
                16
            );

            const blue = parseInt(
                clean.substring(4, 6),
                16
            );

            return (
                'rgba(' +
                red + ', ' +
                green + ', ' +
                blue + ', ' +
                safeOpacity(opacity) +
                ')'
            );

        }

        // ============================================
        // LOAD ALL COUNTRIES FROM QGIS EXPORT
        // ============================================

        async function loadCountries() {

            try {

                const results = await Promise.all([

                    loadJSON(
                        DATA_FILES.countries
                    ),

                    loadJSON(
                        DATA_FILES.styles
                    )

                ]);

                const geojson = results[0];
                const styles = results[1];

                if (
                    !geojson ||
                    geojson.type !==
                        'FeatureCollection' ||
                    !Array.isArray(
                        geojson.features
                    )
                ) {

                    throw new Error(
                        'Invalid countries.geojson.'
                    );

                }

                if (!Array.isArray(styles)) {

                    throw new Error(
                        'Invalid country_styles.json.'
                    );

                }

                const groupedFeatures = new Map();

                geojson.features.forEach(
                    function(feature) {

                        if (
                            !feature ||
                            !feature.geometry
                        ) {
                            return;
                        }

                        const properties =
                            feature.properties || {};

                        const id = String(
                            properties.country_id || ''
                        ).trim();

                        if (!id) {
                            return;
                        }

                        if (!groupedFeatures.has(id)) {

                            groupedFeatures.set(
                                id,
                                []
                            );

                        }

                        groupedFeatures.get(id).push(
                            feature
                        );

                    }
                );

                const normalizedStyles =
                    styles.map(
                        normalizeCountryStyle
                    );

                // Validate all country references
                // before changing the current map.

                normalizedStyles.forEach(
                    function(settings) {

                        if (
                            countryStyles.has(
                                settings.id
                            )
                        ) {

                            throw new Error(
                                'Duplicate country style: ' +
                                settings.id
                            );

                        }

                        if (
                            !groupedFeatures.has(
                                settings.id
                            )
                        ) {

                            throw new Error(
                                'Missing geometry for country: ' +
                                settings.id
                            );

                        }

                        countryStyles.set(
                            settings.id,
                            settings
                        );

                    }
                );

                groupedFeatures.forEach(
                    function(features, id) {

                        if (!countryStyles.has(id)) {

                            throw new Error(
                                'Missing style for country: ' +
                                id
                            );

                        }

                    }
                );

                // Keep the exported order in legend
                // and map layers.

                legendItems.replaceChildren();

                normalizedStyles.forEach(
                    function(settings, index) {

                        const features =
                            groupedFeatures.get(
                                settings.id
                            );

                        addCountry(
                            settings.id,
                            features,
                            settings,
                            index
                        );

                        addLegendItem(settings);

                    }
                );

                if (normalizedStyles.length === 0) {

                    showLegendMessage(
                        'No countries available.'
                    );

                }

                console.info(
                    'Countries loaded:',
                    normalizedStyles.length
                );

            } catch (error) {

                console.error(
                    'Could not load country data:',
                    error
                );

                showLegendMessage(
                    'Country data is temporarily unavailable.'
                );

            }

        }

        // ============================================
        // CAT MARKER SIZES
        // ============================================

        function createCatIcon() {

            const zoom = map.getZoom();

            let size;

            if (zoom <= 3) {

                size = 21;

            } else if (zoom <= 14) {

                size = 25;

            } else if (zoom <= 16) {

                size = 30;

            } else {

                size = 38;

            }

            return L.icon({

                iconUrl: 'images/Group 8.png',

                iconSize: [
                    size,
                    size
                ],

                iconAnchor: [
                    size / 2,
                    size / 2
                ],

                popupAnchor: [
                    0,
                    -size / 2
                ]

            });

        }

        // ============================================
        // PHOTO DATA
        // ============================================

        let photosByPin = {};
        let selectedFeature = null;
        let photosLoaded = false;

        function getPinId(feature) {

            const properties =
                feature.properties || {};

            if (
                properties.fid !== undefined &&
                properties.fid !== null
            ) {

                return String(
                    properties.fid
                );

            }

            return String(
                feature.id
            );

        }

        function photoFileUrl(filename) {

            const normalized = String(
                filename || ''
            ).replace(/\\/g, '/');

            const basename = normalized
                .split('/')
                .pop();

            return (
                'Photos/' +
                encodeURIComponent(
                    basename
                )
            );

        }

        async function loadPhotos() {

            try {

                const records = await loadJSON(
                    DATA_FILES.photos
                );

                if (!Array.isArray(records)) {

                    throw new Error(
                        'Expected an array of photo records.'
                    );

                }

                const result = {};

                records.forEach(function(record) {

                    const pinId = String(
                        record.pin_id
                    );

                    const filename =
                        record.photo;

                    if (!filename) {
                        return;
                    }

                    if (!result[pinId]) {

                        result[pinId] = [];

                    }

                    const url = photoFileUrl(
                        filename
                    );

                    if (
                        !result[pinId].includes(
                            url
                        )
                    ) {

                        result[pinId].push(
                            url
                        );

                    }

                });

                photosByPin = result;
                photosLoaded = true;

                if (selectedFeature) {

                    showPlace(
                        selectedFeature
                    );

                }

            } catch (error) {

                photosLoaded = false;

                console.warn(
                    'Photo data could not be loaded:',
                    error
                );

                if (selectedFeature) {

                    showPlace(
                        selectedFeature
                    );

                }

            }

        }

        // ============================================
        // FULL-SIZE PHOTO VIEWER
        // ============================================

        const photoViewer =
            document.getElementById(
                'photo-viewer'
            );

        const viewerImage =
            document.getElementById(
                'viewer-image'
            );

        function openPhoto(src) {

            viewerImage.src = src;

            photoViewer.classList.add(
                'open'
            );

        }

        function closePhoto() {

            photoViewer.classList.remove(
                'open'
            );

            viewerImage.removeAttribute(
                'src'
            );

        }

        document.getElementById(
            'close-photo-viewer'
        ).addEventListener(
            'click',
            closePhoto
        );

        photoViewer.addEventListener(
            'click',
            function(event) {

                if (
                    event.target === photoViewer
                ) {

                    closePhoto();

                }

            }
        );

        document.addEventListener(
            'keydown',
            function(event) {

                if (
                    event.key === 'Escape'
                ) {

                    closePhoto();

                }

            }
        );

        // ============================================
        // SELECTED PLACE
        // ============================================

        function showPlace(feature) {

            selectedFeature = feature;

            const properties =
                feature.properties || {};

            const placeName =
                properties.name ||
                'Unknown location';

            const pinId = getPinId(
                feature
            );

            const placeAddress = String(
                properties.address || ''
            );

            document.getElementById(
                'place-title'
            ).textContent = placeName;

            document.getElementById(
                'place-address'
            ).textContent = placeAddress;

            const description =
                document.getElementById(
                    'place-description'
                );

            const gallery =
                document.getElementById(
                    'photo-gallery'
                );

            gallery.replaceChildren();

            if (!photosLoaded) {

                description.textContent =
                    'Photos will appear here soon.';

                return;

            }

            const photos =
                photosByPin[pinId] || [];

            if (photos.length === 0) {

                description.textContent =
                    'No photos available for this location.';

                return;

            }

            description.textContent =
                photos.length === 1
                    ? '1 photo'
                    : photos.length + ' photos';

            photos.forEach(
                function(src, index) {

                    const img =
                        document.createElement(
                            'img'
                        );

                    img.className =
                        'gallery-photo';

                    img.src = src;

                    img.alt =
                        placeName +
                        ' — photo ' +
                        (index + 1);

                    img.loading = 'lazy';

                    img.addEventListener(
                        'click',
                        function() {

                            openPhoto(src);

                        }
                    );

                    img.addEventListener(
                        'error',
                        function() {

                            img.style.display =
                                'none';

                            console.warn(
                                'Could not load photo:',
                                src
                            );

                        }
                    );

                    gallery.appendChild(
                        img
                    );

                }
            );

        }

        // ============================================
        // PINS
        // ============================================

        map.createPane(
            'pane_Pins_4'
        );

        map.getPane(
            'pane_Pins_4'
        ).style.zIndex = 404;

        const pinsData = (
            typeof json_Pins_4 !== 'undefined'
        )
            ? json_Pins_4
            : {
                type: 'FeatureCollection',
                features: []
            };

        const layer_Pins_4 = L.geoJSON(
            pinsData,
            {

                pane: 'pane_Pins_4',

                pointToLayer: function(
                    feature,
                    latlng
                ) {

                    return L.marker(
                        latlng,
                        {

                            icon: createCatIcon(),

                            pane:
                                'pane_Pins_4'

                        }
                    );

                },

                onEachFeature: function(
                    feature,
                    layer
                ) {

                    const placeName = (
                        feature.properties &&
                        feature.properties.name
                    )
                        ? feature.properties.name
                        : 'Location';

                    layer.bindPopup(
                        placeName
                    );

                    layer.on(
                        'click',
                        function() {

                            showPlace(
                                feature
                            );

                        }
                    );

                }

            }
        );

        layer_Pins_4.addTo(map);

        // ============================================
        // DYNAMIC CAT SIZE
        // ============================================

        map.on(
            'zoomend',
            function() {

                const icon = createCatIcon();

                layer_Pins_4.eachLayer(
                    function(layer) {

                        if (
                            layer instanceof L.Marker
                        ) {

                            layer.setIcon(
                                icon
                            );

                        }

                    }
                );

            }
        );

        // ============================================
        // RESTORE GRADIENTS AFTER MAP UPDATES
        // ============================================

        function updateAllCountryGradients() {

            countryLayers.forEach(
                function(item) {

                    item.updateGradient();

                }
            );

        }

        map.on(
            'zoomend',
            function() {

                requestAnimationFrame(
                    updateAllCountryGradients
                );

            }
        );

        map.on(
            'viewreset',
            function() {

                requestAnimationFrame(
                    updateAllCountryGradients
                );

            }
        );

        // ============================================
        // MAP RESIZING
        // ============================================

        requestAnimationFrame(
            function() {

                map.invalidateSize();

            }
        );

        window.addEventListener(
            'resize',
            function() {

                map.invalidateSize();

                requestAnimationFrame(
                    updateAllCountryGradients
                );

            }
        );

        // ============================================
        // INITIAL DATA LOADING
        // ============================================

        loadCountries();

        loadPhotos();

    </script>

</body>
</html>
